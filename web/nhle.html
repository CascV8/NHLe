<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHLe Prospect Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Same tokens as the index and the microstat cards; the outcome colours are the NHLe graphic's. */
:root {
  --bg: #0b1117; --surface: #131c24; --ink: #e5ecf1; --muted: #8d9ba7; --line: #24323e; --track: #1e2a35;
  --accent: #f2883a;   /* the Pattullo orange */
  --star: #f2bb18; --nhler: #1fb83a; --bust: #34424f; --nhle: #5bb8f5;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
a { color: var(--accent); }
header { margin-bottom: 16px; }
.nav { margin: 0 0 6px; font: 600 .86rem var(--body); }
h1 { font: 700 2.4rem/1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 70ch; }
h2 { font: 600 .8rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { font: 600 .95rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; }
label { display: inline-flex; gap: 6px; align-items: center; font: 600 .78rem var(--body); text-transform: uppercase;
  letter-spacing: .03em; color: var(--muted); }

.find { position: relative; max-width: 520px; margin-bottom: 18px; }
.find input { width: 100%; font-size: 1.05rem; padding: 10px 12px; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .12);
  max-height: 360px; overflow-y: auto; }
.results li { padding: 7px 9px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.results li[aria-selected="true"], .results li:hover { background: var(--track); }
.results .meta { color: var(--muted); font-size: .84rem; white-space: nowrap; }

.pick { display: inline; padding: 0; border: 0; background: none; color: var(--ink); font: 600 1em var(--body);
  cursor: pointer; text-align: left; }
.pick:hover { text-decoration: underline; }
.dim { color: var(--muted); }
.msg { color: var(--muted); padding: 10px 0; }
.err { color: var(--accent); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: 600 .82rem var(--body); letter-spacing: .03em; text-transform: uppercase; border: 0; background: none;
  color: var(--muted); padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.browse { margin-top: 28px; }
.bar-row { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 10px; }
/* Tables are sized to their columns, like the microstats index, rather than stretched across the page. */
.table { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; max-height: 560px; overflow-y: auto;
  width: fit-content; max-width: 100%; }
table { border-collapse: collapse; width: auto; font-size: .88rem; font-variant-numeric: tabular-nums; }
th { font: 600 .74rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right;
  padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.l, td.l { text-align: left; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--track); }

/* The card: header, outcome bars per draft-relative season, the season labels, then the NHLe line. */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
.card-head { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 16px; align-items: center; padding: 14px 16px;
  border-bottom: 1px solid var(--line); }
/* Photos are transparent cutouts drawn straight on the card; only the initials placeholder keeps a tile. */
.shot { width: 72px; height: 72px; object-fit: contain; object-position: bottom; }
.shot.none { display: grid; place-items: center; font: 700 1.6rem var(--display); color: var(--muted);
  background: var(--track); border-radius: 8px; }
.pname { font: 700 2rem/1 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.pline { font: 600 .95rem var(--body); color: var(--muted); margin-top: 4px; }
.gen { text-align: right; }
.gen b { display: block; font: 700 2.3rem/1 var(--display); font-variant-numeric: tabular-nums; }
.gen span { font: 600 .74rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); padding: 10px 16px 0; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
@media (max-width: 560px) {
  .card-head { grid-template-columns: auto 1fr; }
  .gen { grid-column: 1 / -1; text-align: left; display: flex; gap: 8px; align-items: baseline; }
  .gen b { display: inline; font-size: 1.6rem; }
  .pname { font-size: 1.6rem; }
  .shot { width: 56px; height: 56px; }
}

.cols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0 6px; padding: 0 12px; }
.bars { height: 230px; padding-top: 12px; position: relative; }
.bars::before { content: ""; position: absolute; inset: 12px 12px 0; pointer-events: none;
  background: repeating-linear-gradient(to top, transparent 0 calc(20% - 1px), var(--line) calc(20% - 1px) 20%); opacity: .7; }
.stack { position: relative; display: flex; flex-direction: column-reverse; height: 100%; width: min(64px, 82%); margin: 0 auto;
  border-radius: 4px 4px 0 0; overflow: hidden; }
.stack div { display: grid; place-items: center; font: 700 .86rem var(--display); font-variant-numeric: tabular-nums;
  color: #111; min-height: 0; overflow: hidden; }
.stack .s { background: var(--star); } .stack .n { background: var(--nhler); } .stack .b { background: var(--bust); color: var(--muted); }
.stack.future { border: 1px dashed var(--line); border-bottom: 0; }
.stack.empty { background: repeating-linear-gradient(135deg, var(--track) 0 6px, transparent 6px 12px); }
.known { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font: 700 .7rem var(--display);
  letter-spacing: .06em; text-transform: uppercase; color: #111; }
.known.unrated { top: 40%; color: var(--muted); }
.labels { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 6px; text-align: center; }
.labels b { display: block; font: 700 1.05rem/1.1 var(--display); letter-spacing: .03em; }
.labels span { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 480px) { .labels span { font-size: .62rem; letter-spacing: -.02em; } }
.line { position: relative; height: 220px; margin: 0 12px; }
.line svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--nhle);
  border: 2px solid var(--surface); }
.val { position: absolute; transform: translate(-50%, -100%); margin-top: -10px; text-align: center; white-space: nowrap;
  font: 700 1rem/1 var(--display); font-variant-numeric: tabular-nums; }
.lg { position: absolute; bottom: 6px; transform: translateX(-50%); max-width: 13.5%; text-align: center; font: 600 .72rem/1.15 var(--display);
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
/* League logos are drawn transparent, straight on the card. The site is dark-only, so dark single-colour marks
   (logos.json) are always inverted to stay visible. */
.lg.logo { display: grid; place-items: center; height: 34px; width: 64px; max-width: 13.5%; }
.lg.logo img { display: block; height: 30px; width: 100%; object-fit: contain; }
.lg.logo img.inv { filter: invert(1); }
@media (max-width: 560px) { .lg.logo { height: 28px; } .lg.logo img { height: 24px; } }
.line .none { position: absolute; top: 45%; transform: translateX(-50%); color: var(--muted); }
.line .ax { position: absolute; left: 0; top: 4px; font-size: .7rem; color: var(--muted); }

.detail { padding: 12px 16px 14px; border-top: 1px solid var(--line); }
.detail td.off { color: var(--muted); }
.detail tr.sep td { border-top: 2px solid var(--line); }
.notes { color: var(--muted); font-size: .86rem; max-width: 80ch; display: grid; gap: 6px; margin-top: 14px; }
.notes p { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="nav"><a href="./">← Home</a> · <a href="microstats.html">Microstats</a></p>
    <h1>NHLe <span>Prospect Cards</span></h1>
    <p class="sub">Look up any prospect to see their scoring translated to an NHL rate each season, from the year before their draft
      to five years after it, and the chances that rate has historically meant: a star, an NHLer (200+ games) or a bust.</p>
  </header>

  <div class="find" role="combobox" aria-haspopup="listbox" aria-owns="results" aria-expanded="false" id="find">
    <input type="search" id="q" placeholder="Search a player" aria-label="Search a player" aria-autocomplete="list" autocomplete="off">
    <ul class="results" id="results" role="listbox" hidden></ul>
  </div>

  <div id="card-area" aria-live="polite"></div>

  <section class="browse">
    <div class="bar-row">
      <h2 style="margin:0">Browse</h2>
      <div class="seg" role="group" aria-label="Browse by">
        <button type="button" data-tab="draft" aria-pressed="true">Draft class</button>
        <button type="button" data-tab="league" aria-pressed="false" id="league-tab" hidden>League</button>
      </div>
      <label for="draft-year" data-for="draft">Draft <select id="draft-year"></select></label>
      <label for="league" data-for="league" hidden>League <select id="league"></select></label>
      <label for="league-season" data-for="league" hidden>Season <select id="league-season"></select></label>
    </div>
    <div class="table"><table>
      <thead id="browse-head"></thead>
      <tbody id="browse-rows"><tr><td class="l msg">Loading…</td></tr></tbody>
    </table></div>
  </section>

  <div class="notes" id="notes"></div>
</div>

<script type="module">
import { buildCard, leagueKey } from "./nhle.js";

// Coefficients, league factors and season rules, written from the NHLe repo by web/build.py.
const SPEC = await (await fetch("nhle-model.json")).json();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const api = async (path, params) => {
  const r = await fetch(`api/${path}?${new URLSearchParams(params)}`);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
  return body;
};
const now = new Date();
const CURRENT = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;   // season under way, by start year
const seasonName = y => `${y}-${String(y + 1).slice(2)}`;
// Only a known outcome shows 100% (or 0%); a model probability is shown between 1% and 99%.
const pct = p => `${p === 1 || p === 0 ? p * 100 : Math.min(99, Math.max(1, Math.round(p * 100)))}%`;
let SOURCES = { ep: false };

// Elite Prospects slugs and display names for the leagues the model has factors for (league browsing).
const LEAGUES = [["ohl", "OHL"], ["whl", "WHL"], ["qmjhl", "QMJHL"], ["ushl", "USHL"], ["ncaa", "NCAA"], ["ahl", "AHL"],
  ["shl", "SHL"], ["liiga", "Liiga"], ["khl", "KHL"], ["allsvenskan", "HockeyAllsvenskan"], ["mestis", "Mestis"],
  ["czechia", "Czechia"], ["czechia2", "Czechia2"], ["nl", "NL"], ["sl", "Swiss League"], ["del", "DEL"], ["del2", "DEL2"],
  ["vhl", "VHL"], ["mhl", "MHL"], ["slovakia", "Slovakia"], ["latvia", "Latvia"], ["bchl", "BCHL"],
  ["j20-nationell", "J20 Nationell"], ["u20-sm-sarja", "U20 SM-sarja"], ["czechia-u20", "Czechia U20"],
  ["u20-elit", "U20-Elit"], ["dnl", "DNL"]];

// ── Search ─────────────────────────────────────────────────────────────────────────────────────
let found = [], sel = -1, timer, seq = 0;
function showResults(list) {
  found = list; sel = list.length ? 0 : -1;
  $("results").innerHTML = list.length ? list.map((p, i) => `<li role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === sel}">
      <span>${esc(p.name)} <span class="dim">${esc(p.pos)}</span></span>
      <span class="meta">${esc([p.team, p.league, p.born && `b. ${p.born}`, p.nation].filter(Boolean).join(" · "))}</span></li>`).join("")
    : `<li class="dim" aria-disabled="true">No players found</li>`;
  $("results").hidden = false; $("find").setAttribute("aria-expanded", "true");
}
function hideResults() { $("results").hidden = true; $("find").setAttribute("aria-expanded", "false"); }
$("q").addEventListener("input", e => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (q.length < 2) return hideResults();
  timer = setTimeout(async () => {
    const mine = ++seq;
    try { const list = await api("search", { q }); if (mine === seq) showResults(list); }
    catch (err) { if (mine === seq) { $("results").innerHTML = `<li class="err">${esc(err.message)}</li>`; $("results").hidden = false; } }
  }, 220);
});
$("q").addEventListener("keydown", e => {
  if ($("results").hidden || !found.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + found.length) % found.length;
    for (const li of $("results").children) li.setAttribute("aria-selected", +li.dataset.i === sel);
    $("q").setAttribute("aria-activedescendant", `opt-${sel}`);
  } else if (e.key === "Enter") { e.preventDefault(); choose(found[sel]); }
  else if (e.key === "Escape") hideResults();
});
$("results").addEventListener("click", e => { const li = e.target.closest("li[data-i]"); if (li) choose(found[+li.dataset.i]); });
document.addEventListener("click", e => { if (!e.target.closest("#find")) hideResults(); });

function choose(p) {
  if (!p) return;
  hideResults(); $("q").value = "";
  history.pushState(null, "", `?src=${p.src}&id=${p.id}`);
  show(p.src, p.id, true);
}
window.addEventListener("popstate", fromUrl);

// ── The card ───────────────────────────────────────────────────────────────────────────────────
async function show(src, id, scroll = false) {
  $("card-area").innerHTML = `<p class="msg">Building the card…</p>`;
  try {
    const player = await api("player", { src, id });
    $("card-area").innerHTML = renderCard(player, buildCard(SPEC, player, CURRENT));
    document.title = `${player.name} · NHLe Prospect Cards`;
    if (scroll) $("card-area").scrollIntoView({ behavior: "smooth", block: "start" });
    linkMicrostats(player);
    playerPhoto(player);
  } catch (err) {
    $("card-area").innerHTML = `<p class="msg err">Couldn't load that player (${esc(err.message)}).</p>`;
  }
}

function mainLeague(s) {
  const used = s.rows.filter(r => r.used && r.type === "reg" && !/^wjc/.test(r.key));
  const top = used.sort((a, b) => b.gp - a.gp)[0] || s.rows.filter(r => r.used)[0];
  return top;
}

// The season's main league as its logo (web/logos/), or its name when there's no logo for it.
function leagueTag(s, x) {
  const r = mainLeague(s);
  if (!r) return "";
  const logo = SPEC.logos?.[r.key];
  return logo ? `<span class="lg logo" style="left:${x}%" title="${esc(r.league)}"><img src="${esc(logo.src)}"${logo.invert ? ` class="inv"` : ""} alt="${esc(r.league)}" loading="lazy"></span>`
    : `<span class="lg" style="left:${x}%">${esc(r.league)}</span>`;
}

function renderCard(p, c) {
  if (!c.group) return `<p class="msg">${esc(p.name)} is a goalie; the NHLe model is for skaters.</p>`;
  const d = p.draft;
  const draftLine = d ? `#${d.overall} overall · ${d.year} · ${esc(d.team)}`
    : c.draftYear > CURRENT ? `Draft eligible ${c.draftYear}` : `Undrafted (first eligible ${c.draftYear})`;
  const pos = c.group === "D" ? "Defense" : "Forward";
  const initials = p.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2);
  const L = c.latest;

  const bars = c.seasons.map(s => {
    if (!s.played) return `<div class="stack ${s.future ? "future" : "empty"}" title="${s.future ? "Not played yet" : "No games in a league with an NHLe factor"}"></div>`;
    if (s.unrated) return `<div class="stack empty" title="Not rated: ${esc(s.unrated)}"><span class="known unrated">not rated</span></div>`;
    const star = s.star, nh = s.nhler - s.star, bust = 1 - s.nhler;
    const seg = (cls, v, lab) => `<div class="${cls}" style="height:${(v * 100).toFixed(2)}%" title="${lab}: ${pct(v)}">${v >= .06 ? pct(v) : ""}</div>`;
    return `<div class="stack${s.inProgress ? " live" : ""}">${seg("s", star, "Star")}${seg("n", nh, "NHLer, not a star")}${seg("b", bust, "Bust")}
      ${s.known ? `<span class="known">200 GP</span>` : ""}</div>`;
  }).join("");
  const labels = c.seasons.map(s => `<div><b>${s.label}</b><span>${seasonName(s.year)}${s.inProgress ? "*" : ""}</span></div>`).join("");

  // NHLe line: columns centred at (i + .5) / 7; the top of the scale leaves room for the value labels.
  const played = c.seasons.filter(s => s.played);
  const shown = s => s.adjPts82 ?? s.pts82;   // the line includes the WJC, as NHLe (see nhle.js)
  const top = Math.max(10, ...played.map(shown)) * 1.45;
  const x = i => (i + .5) / 7 * 100, y = v => 100 - v / top * 72 - 22;   // % of the box; 22% at the bottom for league logos
  const pts = c.seasons.map((s, i) => s.played ? `${x(i)},${y(shown(s))}` : null);
  const segs = []; let cur = [];
  for (const p_ of pts) { if (p_) cur.push(p_); else if (cur.length) { segs.push(cur); cur = []; } }
  if (cur.length) segs.push(cur);
  const line = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>
      ${segs.map(sg => `<polyline points="${sg.join(" ")}" fill="none" stroke="var(--nhle)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join("")}</svg>
    ${c.seasons.map((s, i) => s.played
      ? `<span class="dot" style="left:${x(i)}%;top:${y(shown(s))}%"></span>
         <span class="val" style="left:${x(i)}%;top:${y(shown(s))}%"${s.adjPts82 != null ? ` title="${s.pts82.toFixed(1)} in league play, ${s.wjcPts82 >= 0 ? "+" : ""}${s.wjcPts82.toFixed(1)} for the World Juniors"` : ""}>${shown(s).toFixed(1)}</span>
         ${leagueTag(s, x(i))}`
      : `<span class="none" style="left:${x(i)}%">—</span>`).join("")}
    <span class="ax">NHLe pts/82</span>`;

  const detail = c.seasons.flatMap(s => s.rows.length ? s.rows.map((r, j) => `<tr class="${j === 0 ? "sep" : ""}">
      <td class="l">${j === 0 ? `<b>${s.label}</b> <span class="dim">${seasonName(s.year)}</span>` : ""}</td>
      <td class="l${r.used ? "" : " off"}">${esc(r.league)}${r.type === "po" ? " <span class='dim'>playoffs</span>" : ""}</td>
      <td class="l${r.used ? "" : " off"}">${esc(r.team)}</td>
      <td>${r.gp}</td><td>${r.pts}</td>
      <td class="${r.used ? "" : "off"}">${r.used ? r.factor.toFixed(3) : r.why || "no games"}</td>
      <td>${r.used ? (r.pts * r.factor).toFixed(1) : ""}</td>
      ${j === 0 ? `<td rowspan="${s.rows.length}"><b>${s.played ? shown(s).toFixed(1) : "–"}</b>${s.adjPts82 != null
          ? `<br><span class="dim">${s.pts82.toFixed(1)} + ${s.wjcPts82.toFixed(1)} WJC</span>` : ""}</td>
        <td rowspan="${s.rows.length}">${s.nhler != null ? `${pct(s.star)} / ${pct(s.nhler)}${s.known ? "†" : ""}` : s.unrated ? `<span class="dim">not rated: ${esc(s.unrated)}</span>` : "–"}</td>` : ""}
    </tr>`) : []).join("");

  return `<article class="card">
    <div class="card-head">
      <div class="shot none" id="shot">${esc(initials)}</div>
      <div><h2 class="pname">${esc(p.name)}</h2>
        <div class="pline">${draftLine} · ${pos}${p.nation ? ` · ${esc(p.nation)}` : ""}${p.birthDate ? ` · born ${esc(p.birthDate)}` : ""}</div>
        <div class="pline" id="ms-link"></div></div>
      <div class="gen">${L ? `<b>${seasonName(L.year)}</b><span>${L.label} · ${pct(L.star)} star · ${pct(L.nhler)} NHLer</span>`
        : `<span>No seasons in a league with an NHLe factor yet</span>`}</div>
    </div>
    <div class="legend"><span><i style="background:var(--star)"></i>Star (top ${SPEC.star_top}% peak GAR)</span>
      <span><i style="background:var(--nhler)"></i>NHLer (200+ GP)</span><span><i style="background:var(--bust)"></i>Bust</span></div>
    <div class="cols bars">${bars}</div>
    <div class="cols labels">${labels}</div>
    <div class="line">${line}</div>
    <div class="detail"><div class="table" style="max-height:none"><table>
      <thead><tr><th class="l">Season</th><th class="l">League</th><th class="l">Team</th><th>GP</th><th>PTS</th>
        <th>Factor</th><th>NHLe pts</th><th>Pts/82</th><th>Star / NHLer</th></tr></thead>
      <tbody>${detail || `<tr><td class="l msg" colspan="9">No seasons between ${seasonName(c.draftYear - 2)} and ${seasonName(c.draftYear + 4)}.</td></tr>`}</tbody>
    </table></div></div>
  </article>
  <p class="dim" style="font-size:.84rem;margin:0">${played.some(s => s.inProgress) ? "* Season in progress: a few games swing pts/82 a lot. " : ""}${played.some(s => s.known) ? "† Already 200 NHL games, so NHLer is 100%. " : ""}Source: ${p.src === "ep" ? "Elite Prospects" : "NHL"}.</p>`;
}

// The card's photo, from api/photo (cached for the month): the NHL headshot if the NHL has really photographed the
// player, else their photo on a league site (OHL, WHL, QMJHL, Liiga), newest season first. Initials until then.
const PHOTO_LEAGUES = new Set(["ohl", "whl", "qmjhl", "liiga"]);
async function playerPhoto(p) {
  const seasons = [...new Set(p.stats.filter(s => s.type === "reg" && PHOTO_LEAGUES.has(leagueKey(SPEC, s.league)))
    .sort((a, b) => b.season - a.season).map(s => `${leagueKey(SPEC, s.league)}:${s.season}`))].slice(0, 4);
  if (!seasons.length && !p.headshot) return;
  try {
    const { url, cutout: relay } = await api("photo", { nhl: p.headshot || "", name: p.name, born: p.birthDate || "", seasons: seasons.join(",") });
    const shot = $("shot");
    if (!url || !shot) return;
    const img = Object.assign(document.createElement("img"), { className: "shot", alt: "" });
    // NHL and Liiga photos are already cut out; HockeyTech's have a white background to remove (if that fails, show it as is).
    img.onload = () => {
      if (relay && !img.dataset.cut) {
        img.dataset.cut = "1";
        try { img.src = cutout(img); return; } catch (e) {}
      }
      shot.replaceWith(img);   // swap only once it has loaded, so a dead link keeps the initials
    };
    img.src = relay || url;
  } catch (e) {}
}

// Make a studio photo's white background transparent: flood-fill near-white pixels inward from the top and side
// edges (not the bottom, where a white shirt can touch the frame), then fade the light pixels along the cut.
function cutout(img, tol = 38, soft = 70) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const canvas = Object.assign(document.createElement("canvas"), { width: w, height: h });
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, w, h), px = data.data;
  const dist = i => Math.max(255 - px[i], 255 - px[i + 1], 255 - px[i + 2]);   // distance from white
  const bg = new Uint8Array(w * h), queue = [];
  const seed = (x, y) => { const k = y * w + x; if (!bg[k] && dist(k * 4) <= tol) { bg[k] = 1; queue.push(k); } };
  for (let x = 0; x < w; x++) seed(x, 0);
  for (let y = 0; y < h; y++) { seed(0, y); seed(w - 1, y); }
  while (queue.length) {
    const k = queue.pop(), x = k % w, y = (k - x) / w;
    if (x > 0) seed(x - 1, y); if (x < w - 1) seed(x + 1, y); if (y > 0) seed(x, y - 1); if (y < h - 1) seed(x, y + 1);
  }
  for (let k = 0; k < w * h; k++) {
    if (bg[k]) { px[k * 4 + 3] = 0; continue; }
    const x = k % w, edge = (x > 0 && bg[k - 1]) || (x < w - 1 && bg[k + 1]) || (k >= w && bg[k - w]) || (k < w * (h - 1) && bg[k + w]);
    if (edge) px[k * 4 + 3] = Math.round(255 * Math.min(1, dist(k * 4) / soft));
  }
  ctx.putImageData(data, 0, 0);
  return canvas.toDataURL("image/png");
}

async function linkMicrostats(p) {
  if (p.src !== "nhl") return;
  try {
    const seasons = (await (await fetch("data/player_seasons.json")).json())[p.id];
    if (seasons?.length && $("ms-link")) $("ms-link").innerHTML = `<a href="player.html?season=${seasons[0]}&id=${p.id}">Microstat card →</a>`;
  } catch (e) {}
}

// ── Browse ─────────────────────────────────────────────────────────────────────────────────────
let tab = "draft";
const row = cells => `<tr>${cells.map(([v, l]) => `<td class="${l ? "l" : ""}">${v}</td>`).join("")}</tr>`;
const pickBtn = p => `<button type="button" class="pick" data-src="${p.src}" data-id="${esc(p.id)}">${esc(p.name)}</button>`;

async function browse() {
  for (const b of document.querySelectorAll("[data-tab]")) b.setAttribute("aria-pressed", b.dataset.tab === tab);
  for (const l of document.querySelectorAll("[data-for]")) l.hidden = l.dataset.for !== tab;
  $("browse-rows").innerHTML = `<tr><td class="l msg">Loading…</td></tr>`;
  try {
    if (tab === "draft") {
      const list = await api("draft", { year: $("draft-year").value });
      $("browse-head").innerHTML = `<tr><th>#</th><th>Rd</th><th class="l">Player</th><th class="l">Pos</th><th class="l">Team</th><th class="l">Drafted from</th><th class="l">Nation</th></tr>`;
      $("browse-rows").innerHTML = list.map(p => row([[p.overall], [p.round], [pickBtn(p), 1], [esc(p.pos), 1], [esc(p.team), 1],
        [`${esc(p.club)} <span class="dim">${esc(p.league)}</span>`, 1], [esc(p.nation), 1]])).join("")
        || `<tr><td class="l msg">No picks for that year.</td></tr>`;
    } else {
      const list = await api("league", { league: $("league").value, season: $("league-season").value });
      $("browse-head").innerHTML = `<tr><th class="l">Player</th><th class="l">Pos</th><th class="l">Born</th><th class="l">Team</th><th>GP</th><th>G</th><th>A</th><th>PTS</th></tr>`;
      $("browse-rows").innerHTML = list.map(p => row([[pickBtn(p), 1], [esc(p.pos), 1], [p.born ?? "", 1], [esc(p.team), 1],
        [p.gp], [p.g], [p.a], [`<b>${p.pts}</b>`]])).join("") || `<tr><td class="l msg">No players.</td></tr>`;
    }
  } catch (err) {
    $("browse-rows").innerHTML = `<tr><td class="l msg err">Couldn't load the list (${esc(err.message)}).</td></tr>`;
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b?.dataset.tab) { tab = b.dataset.tab; browse(); }
  if (b?.classList.contains("pick")) choose({ src: b.dataset.src, id: b.dataset.id });
});
for (const id of ["draft-year", "league", "league-season"]) $(id).addEventListener("change", browse);

// ── Start ──────────────────────────────────────────────────────────────────────────────────────
function fromUrl() {
  const q = new URLSearchParams(location.search);
  if (/^\d+$/.test(q.get("id") || "")) show(q.get("src") === "ep" ? "ep" : "nhl", q.get("id"));
  else $("card-area").innerHTML = "";
}
const years = Array.from({ length: CURRENT - 2004 }, (_, i) => CURRENT - i);
$("draft-year").innerHTML = years.map(y => `<option>${y}</option>`).join("");
$("league-season").innerHTML = years.map(y => `<option value="${y}">${seasonName(y)}</option>`).join("");
$("league").innerHTML = LEAGUES.map(([slug, name]) => `<option value="${slug}">${esc(name)}</option>`).join("");
$("notes").innerHTML = `
  <p><b>How it works.</b> Each season's points, from every league with an NHL-equivalency factor (regular season and playoffs),
    are scaled by that league's factor and turned into a rate per 82 games. The factors are network NHLe: solved together from
    every player who played in two leagues in the same season. A
    logistic model per position and draft-relative season (D-1 is the year before the draft, DY the draft year) turns that
    rate into the chance of becoming an NHLer (200+ games) and a star. The World Juniors aren't pooled into the rate, where
    seven games would barely register: making the team and scoring there are their own terms in the model, and
    at the WJC-20 they count for more the younger the player is. On the line, a season with a World Juniors is
    plotted at its league NHLe plus the WJC's effect expressed in the same pts/82 (the league rate that would give
    the same NHLer odds without it). The table below splits it into league play and the WJC. A star is
    peak GAR (best 3 seasons) in the top ${SPEC.star_top}% at the position,
    ${SPEC.star_thresholds.F.toFixed(1)}+ for forwards (${esc(SPEC.star_examples.F.slice(0, 3).join(", "))}) and
    ${SPEC.star_thresholds.D.toFixed(1)}+ for defensemen (${esc(SPEC.star_examples.D.slice(0, 3).join(", "))}).
    Fit on the ${SPEC.classes[0]}-${SPEC.classes[1]} draft classes with Neil Paine's GAR.</p>
  <p>Leagues without a factor (minor hockey, U18 leagues, the ECHL) are listed but left out. A season is rated only if it's
    like the ones the models learned from: ${SPEC.min_gp}+ games in rated leagues, and at least half of the season's games in
    them.
    Undrafted players are placed by their first eligible draft (18 by September 15).</p>
  <p id="src-note"></p>`;

api("sources", {}).then(s => { SOURCES = s; }).catch(() => {}).finally(() => {
  $("league-tab").hidden = !SOURCES.ep;
  $("src-note").innerHTML = SOURCES.ep
    ? "Player data: Elite Prospects (search and leagues), with NHL draft lists."
    : "Player data: the NHL's API, which has drafted and signed players only. Undrafted and pre-draft prospects need Elite Prospects.";
  $("q").placeholder = SOURCES.ep ? "Search any player" : "Search a drafted player";
  browse();
});
fromUrl();
</script>
